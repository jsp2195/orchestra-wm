[project]
name = "orchestra-wm"
version = "0.1.0"
description = "Synthetic action-conditioned multi-agent world-model research testbed"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "PyYAML>=6",
    "tensorboard>=2.16",
    "pillow>=10",
    "pyarrow>=17",
    "ijson>=3.3",
]
[dependency-groups]
dev = ["pytest>=8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv]
cache-dir = ".cache/uv"
